<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chot Makes Games</title>
<meta name="description" content="Games and links from Chot Makes Games — indie developer. Outpost: Stardust, Fly to Earth, Kaptain Kannon.">
<meta name="theme-color" content="#8f1a1d">

<!-- Link preview, for when someone shares this in a chat or a post. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Chot Makes Games">
<meta property="og:description" content="Games and links from Chot Makes Games — indie developer.">
<meta property="og:image" content="https://thechot.github.io/assets/dev-icon.png">
<meta property="og:url" content="https://thechot.github.io/">
<meta name="twitter:card" content="summary">

<link rel="icon" href="assets/dev-icon.png">
<link rel="apple-touch-icon" href="assets/dev-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Full-screen CRT dressing: scanlines, flicker and a vignette. Pointer-events none so it
     never swallows a tap on the links underneath. -->
<div class="crt" aria-hidden="true"></div>

<main class="page">

  <header class="profile">
    <div class="avatar-frame">
      <img class="avatar" src="assets/dev-icon.png" alt="Chot Makes Games avatar — a pixel-art portrait in a grey beanie" width="512" height="512">
    </div>

    <!-- data-text feeds the two glitch layers in CSS; keep it identical to the visible text. -->
    <h1 class="glitch" data-text="CHOT MAKES GAMES">CHOT MAKES GAMES</h1>
    <p class="tagline">&gt; indie game developer<span class="caret" aria-hidden="true">_</span></p>
  </header>

  <h2 class="section-label">Games</h2>
  <nav class="links" aria-label="Games">

    <a class="link-card" href="https://play.google.com/store/apps/details?id=com.chotmakesgames.outpoststardust" target="_blank" rel="noopener">
      <img class="thumb" src="assets/outpost-stardust.png" alt="" width="512" height="512" loading="lazy">
      <span class="link-text">
        <span class="link-title">Outpost: Stardust</span>
        <span class="link-sub">Google Play</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="link-card" href="https://play.google.com/store/apps/details?id=com.meerkatsmoothie.flytoearth" target="_blank" rel="noopener">
      <img class="thumb" src="assets/fly-to-earth.png" alt="" width="512" height="512" loading="lazy">
      <span class="link-text">
        <span class="link-title">Fly to Earth</span>
        <span class="link-sub">Google Play</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="link-card" href="https://play.google.com/store/apps/details?id=com.Chot_dev.KaptainKannon" target="_blank" rel="noopener">
      <img class="thumb" src="assets/kaptain-kannon.png" alt="" width="512" height="512" loading="lazy">
      <span class="link-text">
        <span class="link-title">Kaptain Kannon</span>
        <span class="link-sub">Google Play</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

  </nav>

  <h2 class="section-label">Follow</h2>
  <nav class="links" aria-label="Social media">

    <a class="link-card" href="https://www.instagram.com/chot_makes_games/" target="_blank" rel="noopener">
      <span class="icon-slot" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">Instagram</span>
        <span class="link-sub">@chot_makes_games</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

    <a class="link-card" href="https://web.facebook.com/ChotMakesGames2026" target="_blank" rel="noopener">
      <span class="icon-slot" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M14.5 22v-8h2.8l.5-3.3h-3.3V8.5c0-1 .3-1.6 1.7-1.6h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.6H8.2V14h3v8z" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="link-text">
        <span class="link-title">Facebook</span>
        <span class="link-sub">Chot Makes Games</span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>

  </nav>

  <footer class="footer">
    <p class="press-start">&copy; <span id="year">2026</span> Chot Makes Games</p>
  </footer>

</main>

<script>
  // Keeps the copyright year honest without a build step.
  document.getElementById('year').textContent = new Date().getFullYear();

  // Belt and braces alongside service-worker.js: if a visitor arrives here still carrying the old
  // create-react-app worker, tear it down from the page side too. service-worker.js handles the
  // case where the browser re-checks the worker; this handles the case where the page loads first.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      for (var i = 0; i < regs.length; i++) regs[i].unregister();
    }).catch(function () { /* nothing to clean up */ });
  }
</script>

</body>
</html>
